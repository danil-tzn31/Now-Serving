# Eval questions for Now Serving.
#
# type:      answerable | not_covered | safety (used for grouping in the report)
# language:  en | tl (Filipino or Taglish)
# expect:    answer (should be grounded) | refuse (fallback or blocked)
# expected_article:  the article that should come back as a source
# must_include:      facts the answer needs, written from the article, not the bot
# must_not_include:  things that would make the answer wrong

- id: q01
  question: What do I need to renew my passport?
  type: answerable
  language: en
  expect: answer
  expected_article: passport-renewal-adult
  must_include:
    - current ePassport
    - photocopy of the data page
    - online appointment

- id: q02
  question: magkano ang PSA birth certificate pag walk-in?
  type: answerable
  language: tl
  expect: answer
  expected_article: psa-birth-cert-in-person
  must_include:
    - ₱155 per copy
    - appointment needed

